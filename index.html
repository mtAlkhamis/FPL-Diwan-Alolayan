<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#38003C;color:#fff;font-family:Tajawal,'Segoe UI',sans-serif;text-align:right}
  body{-webkit-font-smoothing:antialiased}
  ::selection{background:#00FF85;color:#38003C}
  .num{font-family:Oswald,sans-serif}
  bdi{unicode-bidi:isolate}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  .nav{position:sticky;top:0;z-index:20;background:rgba(42,0,46,.94);backdrop-filter:blur(10px);border-bottom:3px solid #E90052}
  .nav .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;direction:ltr}
  .logo b{font-family:Oswald,sans-serif;font-size:24px;font-weight:700;white-space:nowrap}
  .dot{width:14px;height:14px;background:#00FF85}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto}
  .tab{font-size:17px;font-weight:700;padding:8px 16px;background:rgba(255,255,255,.08);cursor:pointer;border:0;color:#fff;font-family:inherit}
  .tab:hover{background:#E90052}
  .tab.on{background:#E90052}
  h1.hero{margin:0 0 24px;font-family:Oswald,sans-serif;font-size:clamp(52px,12vw,124px);line-height:.92;font-weight:700;letter-spacing:-2px;direction:ltr;text-align:right}
  h2.sec{margin:0 0 6px;font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1}
  .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .eyebrow div:last-child{flex:1;height:2px;background:rgba(255,255,255,.15)}
  .lede{margin:0 0 36px;font-size:clamp(18px,2.6vw,28px);line-height:1.5;font-weight:500;color:rgba(255,255,255,.78);max-width:720px;text-wrap:pretty}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{padding:20px}
  .stat .n{font-family:Oswald,sans-serif;font-size:clamp(40px,6vw,60px);font-weight:700;line-height:1}
  .stat .l{font-size:18px;font-weight:700;margin-top:6px}
  .hd{border-bottom:5px solid #00FF85;padding-bottom:14px;margin-bottom:22px}
  .hd .s{font-size:18px;font-weight:700;color:#00FF85}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .awards{display:flex;flex-direction:column;gap:10px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pair.solo{grid-template-columns:1fr}
  .pair>*{min-width:0}
  @media (max-width:720px){.pair{grid-template-columns:1fr}}
  .champ{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#46124F;border-right:6px solid #00FF85;padding:13px 16px;cursor:pointer}
  .champ:hover{background:#5A1A67}
  .recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .rec{padding:24px}
  .rec .k{font-size:18px;font-weight:700;margin-bottom:12px}
  .rec .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:10px}
  .rec .who{font-size:26px;font-weight:900}
  .rec .big{font-family:Oswald,sans-serif;font-size:56px;font-weight:700;line-height:.9}
  .thead,.trow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 14px}
  .thead{background:#2A002E;font-size:15px;font-weight:800;color:rgba(255,255,255,.7);border-bottom:3px solid #E90052}
  .trow{background:#431350;cursor:pointer;border-right:6px solid rgba(255,255,255,.14)}
  .trow:hover{background:#55195F}
  .c-rank{flex:0 0 40px;font-family:Oswald,sans-serif;font-size:22px;font-weight:700}
  .c-name{flex:1 1 140px;min-width:0;overflow:hidden}
  .tcard{padding:20px;display:flex;flex-direction:column;gap:6px}
  .tpairs{display:grid;grid-template-columns:minmax(0,1fr) 32px 20px minmax(0,1fr) 32px;gap:6px 8px;align-items:center;margin-top:6px}
  .tpair{display:contents}
  .tpair .nm{font-size:17px;font-weight:800;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tpair .out{text-decoration:line-through;opacity:.6}
  .tpair .arw{font-size:20px;opacity:.75;text-align:center}
  .tpair .p{font-family:Oswald,sans-serif;font-size:15px;font-weight:700;padding:2px 0;text-align:center}
  @media (max-width:560px){
    .tpairs{grid-template-columns:minmax(0,1fr) 28px 18px minmax(0,1fr) 28px;gap:5px 6px}
    .tpair .nm{font-size:15px}
  }
  .ttot{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;font-weight:700;opacity:.75;margin-top:6px}
  .ttot .num{font-size:17px}
  .thit{font-size:14px;font-weight:800;opacity:.75}
  a.gw-lnk{display:block;margin-top:3px;font-size:14px;font-weight:800;color:#04F5FF;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
  a.gw-lnk:hover{text-decoration:underline}
  .c-name b{font-size:19px;font-weight:800;line-height:1.25;display:block}
  .c-name span{font-size:15px;font-weight:500;color:rgba(255,255,255,.55)}
  .c-pts{flex:0 0 84px;font-family:Oswald,sans-serif;font-size:21px;font-weight:600}
  .c-sub{flex:0 0 92px;font-family:Oswald,sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,.6)}
  .rows{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .scard{background:#46124F;border-bottom:5px solid #00FF85;padding:18px;cursor:pointer}
  .scard:hover{background:#5A1A67}
  .mcard{background:#46124F;padding:16px;cursor:pointer;border-right:6px solid rgba(255,255,255,.14)}
  .mcard:hover{background:#5A1A67}
  .back{display:inline-block;font-size:16px;font-weight:700;color:#04F5FF;margin-bottom:18px;cursor:pointer}
  .btn{font-size:16px;font-weight:700;padding:10px 16px;background:rgba(255,255,255,.1);cursor:pointer;border:0;color:#fff;font-family:inherit}
  .btn:hover{background:#E90052}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:30px}
  .tile{padding:18px;background:#46124F;border:2px solid rgba(255,255,255,.18)}
  .tile .n{font-family:Oswald,sans-serif;font-size:40px;font-weight:700;line-height:1}
  .tile .l{font-size:16px;font-weight:700;margin-top:4px}
  select{width:100%;background:#46124F;color:#fff;padding:12px 14px;font-family:Tajawal,sans-serif;font-size:19px;font-weight:800;direction:rtl}
  .cmp-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:12px;background:#2A002E;padding:12px 14px;border-bottom:3px solid #04F5FF}
  .cmp-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:12px;background:#431350;padding:12px 14px}
  .foot{border-top:3px solid #E90052;background:#2A002E;margin-top:40px}
  .foot .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:22px;padding-bottom:22px}
  .bars{display:flex;gap:8px}
  .bars i{width:24px;height:9px;display:block}
  section.pad{padding-top:clamp(32px,5vw,60px)}

  @media (max-width:560px){
    .nav .wrap{gap:10px}
    .thead,.trow{flex-wrap:nowrap;gap:8px;padding:11px 10px}
    .thead{font-size:13px}
    .thead>div:nth-child(1){flex:0 0 24px !important}
    .thead>div:nth-child(2){flex:1 1 40px !important}
    .thead>div:nth-child(3){flex:0 0 56px !important}
    .thead>div:nth-child(4){flex:0 0 70px !important}
    .c-rank{flex:0 0 24px !important;font-size:19px}
    .c-name{flex:1 1 40px !important}
    .c-name b{font-size:17px}
    .c-name span{font-size:13px}
    .c-pts{flex:0 0 56px !important;font-size:18px}
    .c-sub{flex:0 0 70px !important;font-size:15px}
    .gw-mv{display:none !important}

    .thead-m>div:nth-child(1){flex:0 0 46px !important}
    .thead-m>div:nth-child(2){flex:0 0 26px !important}
    .thead-m>div:nth-child(3){flex:1 1 40px !important}
    .trow-m>div:nth-child(1){flex:0 0 46px !important;font-size:17px !important}
    .trow-m>div:nth-child(2){flex:0 0 26px !important;font-size:19px !important}
    .trow-m>div:nth-child(3){flex:1 1 40px !important;font-size:17px !important}
  }
</style>

<body>
<div class="nav"><div class="wrap">
  <div class="logo" data-go="home"><div class="dot"></div><b id="brandNav"></b></div>

    <button class="tab" data-go="home">الرئيسية</button>

</div></div>

<div id="app"></div>

<div class="foot"><div class="wrap">
  <div id="brandFoot" style="font-size:17px;font-weight:700;color:rgba(255,255,255,.55);white-space:nowrap"></div>
  <div id="lastUpdated" style="font-size:15px;font-weight:700;color:rgba(255,255,255,.42)"></div>
  <div class="bars"><i style="background:#E90052"></i><i style="background:#00FF85"></i><i style="background:#04F5FF"></i></div>
</div></div>

<script>
var AR = {}, ROWS = [], META = {};



var GW_STATS = [], GW_HL = [], GW_POP = {}, SEASON_SUMMARY = [], GENERATED_AT = null, LIVE_GW = null;

var CHIP_AR = {bboost:'بنش بوست', '3xc':'كابتن ثلاثي', wildcard:'وايلد كارد', freehit:'فري هت'};
var GWS = [], LAST_GW = null;
function computeGws() {
  GWS = [];
  GW_STATS.forEach(function (r) { if (GWS.indexOf(r[0]) < 0) GWS.push(r[0]); });
  GWS.sort(function (a, b) { return a - b; });
  LAST_GW = GWS[GWS.length - 1];
}
var nameAr = function (en) { return AR[en] || en; };
var gwRows = function (g) {
  return GW_STATS.filter(function (r) { return r[0] === g; })
    .sort(function (a, b) { return a[12] - b[12] || b[3] - a[3]; });
};
var gwHl = function (g) { var o = null; GW_HL.forEach(function (h) { if (h.gameweek === g) o = h; }); return o || {}; };

var awardCard = function (o) {
  if (!o.who && !o.who2) return '';
  return '<div style="background:' + o.bg + ';color:' + (o.fg || '#fff') + ';padding:20px;display:flex;flex-direction:column;gap:6px' + (o.border ? ';border:2px solid ' + o.border : '') + '">' +
    '<div style="font-size:16px;font-weight:800;' + (o.kc ? 'color:' + o.kc : 'opacity:.75') + '">' + o.k + '</div>' +
    '<div style="font-size:clamp(21px,3vw,26px);font-weight:900;line-height:1.15">' + esc(o.who) + '</div>' +
    (o.sub ? '<div style="font-size:16px;font-weight:600;opacity:.8;line-height:1.4">' + o.sub + '</div>' : '') +
    (o.big !== undefined ? '<div class="num" style="font-size:44px;font-weight:700;line-height:1;margin-top:2px">' + o.big + '</div>' : '') +
    '</div>';
};

function tChips(list) {
  return String(list || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean)
    .map(function (x) { return '<span class="tchip">' + esc(x) + '</span>'; }).join('');
}
function signed(n) { return (n > 0 ? '+' : '') + n; }

function moveCard(o) {
  if (!o.manager) return '';
  var pin = String(o.pIn || ''), pout = String(o.pOut || '');
  if (pin.indexOf(',') >= 0 || pout.indexOf(',') >= 0) return '';
  var hit = ((+o.ptsIn) - (+o.ptsOut)) - (+o.net);
  return '<div style="background:' + o.bg + ';' + (o.fg ? 'color:' + o.fg + ';' : '') + (o.border ? 'border:2px solid ' + o.border + ';' : '') + 'padding:20px;display:flex;flex-direction:column;gap:6px">' +
    '<div style="font-size:16px;font-weight:800;' + (o.kc ? 'color:' + o.kc : 'opacity:.7') + '">' + o.k + '</div>' +
    '<div style="font-size:clamp(21px,3vw,26px);font-weight:900;line-height:1.15">' + esc(nameAr(o.manager)) + '</div>' +
    '<div class="tpairs"><div class="tpair">' +
      '<span class="nm out">' + esc(pout) + '</span>' +
      '<span class="p" style="background:rgba(' + (o.fg ? '56,0,60' : '255,255,255') + ',.12);opacity:.75">' + o.ptsOut + '</span>' +
      '<span class="arw">←</span>' +
      '<span class="nm">' + esc(pin) + '</span>' +
      '<span class="p" style="background:' + o.chip + ';color:' + o.chipFg + '">' + o.ptsIn + '</span>' +
    '</div></div>' +
    '<div class="num" style="font-size:44px;font-weight:700;line-height:1;margin-top:8px;direction:ltr;text-align:right' + (o.netColor ? ';color:' + o.netColor : '') + '">' + signed(o.net) + '</div>' +
    '<div style="font-size:15px;font-weight:700;opacity:.7">محصلة التبديل' +
      (hit ? ' (مع <span class="num" style="direction:ltr;display:inline-block">' + signed(-hit) + '</span>)' : '') + '</div></div>';
}

function tList(v) {
  return String(v || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
}

function tObjs(arr, str) {
  if (arr && arr.length) return arr.map(function (x) { return { name: x.name, points: x.points }; });
  return tList(str).map(function (n) { return { name: n, points: null }; });
}

function tradeCard(o) {
  if (!o.manager) return '';
  var outs = tObjs(o.outArr, o.out), ins = tObjs(o['in' + 'Arr'], o['in']);
  if (outs.length < 2 && ins.length < 2 && o.twinManager === o.manager && (+o.twinNet) === (+o.net)) return '';
  var raw = (+o.ptsIn) - (+o.ptsOut);
  var hit = raw - (+o.net);
  var n = Math.max(outs.length, ins.length);
  var pairs = '';
  for (var i = 0; i < n; i++) {
    var a = outs[i], b = ins[i];
    pairs += '<div class="tpair">' +
      '<span class="nm out">' + esc(a ? a.name : '—') + '</span>' +
      '<span class="p" style="background:rgba(255,255,255,.1);opacity:.7">' + (a && a.points !== null ? a.points : '') + '</span>' +
      '<span class="arw">←</span>' +
      '<span class="nm">' + esc(b ? b.name : '—') + '</span>' +
      '<span class="p" style="background:' + o.line + ';color:#38003C">' + (b && b.points !== null ? b.points : '') + '</span>' +
      '</div>';
  }
  return '<div class="tcard" style="background:' + o.bg + ';border:2px solid ' + o.line + '">' +
    '<div style="font-size:16px;font-weight:800;color:' + o.line + '">' + o.k + '</div>' +
    '<div style="font-size:clamp(21px,3vw,26px);font-weight:900;line-height:1.15">' + esc(nameAr(o.manager)) + '</div>' +
    '<div class="tpairs">' + pairs + '</div>' +
    '<div class="num" style="font-size:44px;font-weight:700;line-height:1;margin-top:2px;direction:ltr;text-align:right;color:' + o.line + '">' + signed(o.net) + '</div>' +
    '<div style="font-size:15px;font-weight:700;opacity:.7">المحصلة' +
      (hit ? ' (مع <span class="num" style="direction:ltr;display:inline-block">' + signed(-hit) + '</span>)' : '') + '</div></div>';
}

function gwAwards(g) {
  var h = gwHl(g);
  var pair = function (a, b) {
    var have = [a, b].filter(Boolean);
    if (!have.length) return '';
    return '<div class="pair' + (have.length === 1 ? ' solo' : '') + '">' + have.join('') + '</div>';
  };
  var crowdCard = function (k, player, pct, sub, bg) {
    if (!player) return '';
    return '<div style="background:' + bg + ';color:#38003C;padding:24px">' +
      '<div style="font-size:16px;font-weight:800;opacity:.8">' + k + '</div>' +
      '<div style="font-size:clamp(26px,4vw,34px);font-weight:900;direction:ltr;text-align:right">' + esc(player) + '</div>' +
      '<div style="font-size:17px;font-weight:600;opacity:.85"><span class="num" style="font-weight:700">' + Math.round(pct) + '%</span> ' + sub + '</div></div>';
  };
  return '<div class="awards">' +
    pair(
      awardCard({ k: 'نجم الجولة', who: nameAr(h.top_scorer), big: h.top_score, sub: 'أعلى واحد بالدوري هالجولة', bg: '#00FF85', fg: '#38003C' }),
      awardCard({ k: 'خيبة الجولة', who: nameAr(h.bottom_scorer), big: h.bottom_score, sub: 'الله يعوّض عليه', bg: '#E90052' })) +
    pair(
      awardCard({ k: 'الكابتن الذهبي', who: capWho(g, h.best_captain_player, h.best_captain_manager), big: h.best_captain_points, sub: capSub(g, h.best_captain_player, h.best_captain_manager), bg: '#04F5FF', fg: '#38003C' }),
      awardCard({ k: 'الكابتن المنحوس', who: capWho(g, h.worst_captain_player, h.worst_captain_manager), big: h.worst_captain_points, sub: (capCount(g, h.worst_captain_player) > 1 ? '<span class="num" style="font-weight:800">' + capCount(g, h.worst_captain_player) + '</span> ' + mgrWord(capCount(g, h.worst_captain_player)) + ' عطوه الكبتنة 💀' : 'عطاه الكبتنة <bdi><b style="font-weight:800">' + nameAr(h.worst_captain_manager) + '</b></bdi> 💀'), bg: '#2A002E', kc: '#FF5C9E' })) +
    pair(
      awardCard({ k: 'صاروخ الجولة', who: nameAr(h.biggest_riser), big: h.riser_places_gained ? '▲' + h.riser_places_gained : undefined, sub: 'مركز طلعهم فوق', bg: '#00FF85', fg: '#38003C' }),
      awardCard({ k: 'سقوط حر', who: nameAr(h.biggest_faller), big: h.faller_places_lost ? '▼' + h.faller_places_lost : undefined, sub: 'مركز راحوا عليه', bg: '#E90052' })) +
    pair(
      moveCard({ k: 'ضربة معلم — أقوى صفقة فردية', manager: h.one_move_master_manager, pOut: h.one_move_master_player_out, pIn: h.one_move_master_player_in, ptsOut: h.one_move_master_points_out, ptsIn: h.one_move_master_points_in, net: h.one_move_master_net_impact, bg: '#00FF85', fg: '#38003C', chip: '#38003C', chipFg: '#00FF85' }),
      moveCard({ k: 'أسوأ صفقة — تبديل واحد', manager: h.one_move_disaster_manager, pOut: h.one_move_disaster_player_out, pIn: h.one_move_disaster_player_in, ptsOut: h.one_move_disaster_points_out, ptsIn: h.one_move_disaster_points_in, net: h.one_move_disaster_net_impact, bg: '#2A002E', border: '#FF5C9E', kc: '#FF5C9E', chip: '#FF5C9E', chipFg: '#38003C', netColor: '#FF5C9E' })) +
    pair(
      tradeCard({ k: 'أذكى صفقات الجولة — كل التبديلات', manager: h.sharpest_trader_manager, out: h.sharpest_trader_players_out, in: h.sharpest_trader_players_in, outArr: h.sharpest_trader_out, inArr: h.sharpest_trader_in, ptsOut: h.sharpest_trader_points_out, ptsIn: h.sharpest_trader_points_in, net: h.sharpest_trader_net_impact, twinManager: h.one_move_master_manager, twinNet: h.one_move_master_net_impact, bg: '#38003C', line: '#04F5FF' }),

var app = document.getElementById('app');

function buildCareer() {

function buildRows() {
  var seen = {};
  ROWS.forEach(function (r) { if (!seen[r[0]]) { seen[r[0]] = 1; seasons.push(r[0]); } });
  seasons.sort();
  ROWS.forEach(function (r) {
    var m = mgrs[r[2]] || (mgrs[r[2]] = { en: r[2], ar: AR[r[2]] || r[2], team: r[3], rows: [] });
    m.team = r[3];
    m.rows.push({ season: r[0], pos: r[1], pts: r[4], rank: r[5] });
    if (!bestSeason || r[4] > bestSeason.pts) bestSeason = { en: r[2], season: r[0], pts: r[4], rank: r[5] };
  });

  var lastOf = {};
  seasons.forEach(function (ss) {
    var rows = ROWS.filter(function (r) { return r[0] === ss; });
    if (!rows.length) return;
    var mx = Math.max.apply(null, rows.map(function (r) { return r[1]; }));
    rows.forEach(function (r) { if (r[1] === mx) (lastOf[r[2]] = lastOf[r[2]] || []).push(ss); });
  });

  var arSets = {};
  Object.keys(mgrs).forEach(function (k) { (arSets[mgrs[k].ar] = arSets[mgrs[k].ar] || []).push(k); });
  Object.keys(mgrs).forEach(function (k) {
    var m = mgrs[k];
    var at = function (p) { return m.rows.filter(function (r) { return r.pos === p; }); };
    m.total = m.rows.reduce(function (a, r) { return a + r.pts; }, 0);
    m.count = m.rows.length;
    m.titleSeasons = at(1).map(function (r) { return r.season; });
    m.titles = m.titleSeasons.length;
    m.seconds = at(2).length;
    m.thirds = at(3).length;
    m.podiums = m.rows.filter(function (r) { return r.pos <= 3; }).length;
    m.lastSeasons = lastOf[k] || [];
    m.lasts = m.lastSeasons.length;
    m.best = Math.min.apply(null, m.rows.map(function (r) { return r.pos; }));
    m.avg = (m.rows.reduce(function (a, r) { return a + r.pos; }, 0) / m.count).toFixed(2);
    m.bestRank = Math.min.apply(null, m.rows.map(function (r) { return r.rank; }));
    m.display = arSets[m.ar].length > 1 ? m.ar + ' — ' + m.team : m.ar;
    allTime.push(m);

  allTime.sort(function (a, b) { return b.total - a.total; });
  allTime.forEach(function (m, i) { m.allRank = i + 1; });
  champCount = allTime.filter(function (m) { return m.titles > 0; }).length;
  seasons.forEach(function (ss) {
    var list = seasonRows(ss);

    var pick = function (x) { return x ? { en: x.m.en, ar: x.m.ar, team: x.m.team, pts: x.r.pts } : null; };

  });
}

          '<div class="stat" style="background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)"><div class="n">' + (bestSeason ? bestSeason.pts : '—') + '</div><div class="l">أعلى نقاط بموسم</div></div>') +

      '<div style="font-size:clamp(20px,3vw,26px);font-weight:900;line-height:1.15;margin-top:4px">' + esc(o.ar) + '</div>' +
      '<div style="font-size:15px;font-weight:500;opacity:.7">' + esc(o.team || '') + '</div>' +
      '<div class="num" style="font-size:26px;font-weight:700;margin-top:6px">' + o.pts + '</div></div>';
  };
  var shown = [t.champion, t.runner, t.third].filter(Boolean);

    slot(t.champion, 1, 'البطل', '#FFD166', '#38003C') +

    slot(t.third, 3, 'المركز الثالث', '#E09468', '#38003C') +

    (t.n && t.n > covered ? '<p style="margin:0;font-size:16px;font-weight:600;color:rgba(255,255,255,.5);text-wrap:pretty">الترتيب الكامل لهذا الموسم غير متوفر في البيانات — بس المنصة وصاحب المركز الأخير.</p>' : '');
}

    return '<div class="trow trow-m" data-season="' + r.season + '" style="border-right-color:' + a + '">' +
      '<div class="num" style="flex:0 0 68px;font-size:21px;font-weight:700;color:#04F5FF;direction:ltr;text-align:right">' + label(r.season) + '</div>' +
      '<div class="num" style="flex:0 0 44px;font-size:24px;font-weight:700;color:' + a + '">' + r.pos + '</div>' +
      '<div class="num" style="flex:1 1 80px;min-width:0;font-size:21px;font-weight:600">' + r.pts + '</div>' +
      '<div class="c-sub">' + fmt(r.rank) + '</div></div>';
  }).join('');
  return '<section class="pad"><div class="wrap"><div class="back" data-go="archive">← رجوع</div>' +
    '<div style="border-bottom:5px solid #E90052;padding-bottom:18px;margin-bottom:22px">' +
    '<div style="font-size:18px;font-weight:700;color:#E90052">ملف المشترك</div>' +
    '<h2 style="margin:6px 0 4px;font-size:clamp(32px,6vw,58px);font-weight:900;line-height:1.05">' + esc(m.ar) + '</h2>' +
    '<div style="font-size:20px;font-weight:500;color:rgba(255,255,255,.6)">' + esc(m.team) + '</div></div>' +
    '<div class="tiles">' +
      (SINGLE ? '' :
        '<div class="tile" style="background:#E90052;border:0"><div class="n">' + m.titles + '</div><div class="l">' + titleWord(m.titles) + '</div></div>' +
        '<div class="tile" style="background:#00FF85;color:#38003C;border:0"><div class="n">' + m.podiums + '</div><div class="l">' + timesWord(m.podiums) + ' بالمراكز الثلاثة الأولى</div></div>') +
      (SINGLE ? '' : tile(m.count, seasonWord(m.count))) + tile(fmt(m.total), 'مجموع النقاط') +
      (m.avg !== null ? tile(m.avg, 'متوسط الترتيب', '#04F5FF')
        : SINGLE ? '' : tile(fmt(Math.round(m.avgPts || 0)), 'متوسط نقاط الموسم', '#04F5FF')) +
      (m.bestRank !== null ? tile(fmt(m.bestRank), 'أفضل ترتيب عالمي', '#04F5FF')
        : tile(m.best, SINGLE ? 'مركزه بالموسم' : 'أفضل مركز', '#04F5FF')) +
      (!SINGLE && m.seconds ? tile(m.seconds, 'مرات وصيف') : '') +
      (!SINGLE && m.lasts ? tile(m.lasts, timesWord(m.lasts) + ' بالمركز الأخير', '#FF5C9E') : '') +
    '</div>' +
    (rows ? '<div class="thead thead-m" style="border-bottom-color:#04F5FF"><div style="flex:0 0 68px">الموسم</div><div style="flex:0 0 44px">المركز</div><div style="flex:1 1 80px">النقاط</div><div style="flex:0 0 92px">عالمياً</div></div>' +
      '<div class="rows">' + rows + '</div>'
      : seasonTagsBlock(m)) +
    '</div></section>';
}

var cmpA = null, cmpB = null;
function compareView() {
  var A = mgrs[cmpA || allTime[0].en], B = mgrs[cmpB || allTime[1].en];
  cmpA = A.en; cmpB = B.en;
  var opts = function (sel) {
    return allTime.map(function (m) {
      return '<option value="' + esc(m.en) + '"' + (m.en === sel ? ' selected' : '') + '>' + esc(m.display) + '</option>';
    }).join('');
  };
  var shared = A.rows.filter(function (r) { return B.rows.some(function (x) { return x.season === r.season; }); });
  var aw = 0, bw = 0;
  shared.forEach(function (r) {
    var o = null; B.rows.forEach(function (x) { if (x.season === r.season) o = x; });
    if (r.pos < o.pos) aw++; else bw++;
  });
  var h2h = aw === bw ? 'تعادل ' + aw + ' — ' + bw + ' 😐'
    : (aw > bw ? A.ar : B.ar) + ' متقدم ' + Math.max(aw, bw) + ' مقابل ' + Math.min(aw, bw);
  var G = '#00FF85', P = '#FF5C9E', N = 'rgba(255,255,255,.75)';
  var row = function (l, a, b, hi, fa, fb) {
    var better = a === b ? 0 : (hi ? (a > b ? 1 : 2) : (a < b ? 1 : 2));
    return '<div class="cmp-row"><div class="num" style="font-size:24px;font-weight:700;color:' + (better === 1 ? G : N) + '">' + (fa !== undefined ? fa : a) + '</div>' +
      '<div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.6)">' + l + '</div>' +
      '<div class="num" style="font-size:24px;font-weight:700;text-align:left;color:' + (better === 2 ? P : N) + '">' + (fb !== undefined ? fb : b) + '</div></div>';
  };
  return '<section class="pad"><div class="wrap">' +
    '<div class="hd" style="border-bottom-color:#04F5FF"><div class="s" style="color:#04F5FF">وجه لوجه</div><h2 class="sec" style="margin-top:6px">مقارنة بين مشتركين</h2></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:24px">' +
    '<div><div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:6px">المشترك الأول</div><select id="selA" style="border:2px solid #00FF85">' + opts(A.en) + '</select></div>' +
    '<div><div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:6px">المشترك الثاني</div><select id="selB" style="border:2px solid #E90052">' + opts(B.en) + '</select></div></div>' +
    (A.rows.length && B.rows.length ? '<div style="background:linear-gradient(120deg,#E90052 0%,#7A0B4A 100%);padding:22px;margin-bottom:20px">' +
      '<div style="font-size:16px;font-weight:700;opacity:.8;margin-bottom:6px">تقابلوا في ' + shared.length + ' ' + seasonWord(shared.length) + '</div>' +
      '<div style="font-size:clamp(20px,3vw,28px);font-weight:900;line-height:1.35">' + esc(h2h) + '</div></div>' : '') +
    '<div class="cmp-hd"><div style="font-size:18px;font-weight:900;color:#00FF85">' + esc(A.display) + '</div>' +
    '<div style="font-size:14px;font-weight:700;color:rgba(255,255,255,.5)">المقارنة</div>' +
    '<div style="font-size:18px;font-weight:900;color:#FF5C9E;text-align:left">' + esc(B.display) + '</div></div>' +
    '<div class="rows">' +
      (SINGLE ? '' : row('ألقاب', A.titles, B.titles, true) +
        row('مرات بالمراكز الثلاثة الأولى', A.podiums, B.podiums, true)) +
      row('مجموع النقاط', A.total, B.total, true, fmt(A.total), fmt(B.total)) +
      (SINGLE ? '' : row('مواسم', A.count, B.count, true)) +
      (A.avg !== null ? row('متوسط الترتيب', +A.avg, +B.avg, false, A.avg, B.avg)
        : row('متوسط نقاط الموسم', A.avgPts, B.avgPts, true, fmt(Math.round(A.avgPts || 0)), fmt(Math.round(B.avgPts || 0)))) +
      row(SINGLE ? 'المركز' : 'أفضل مركز', A.best, B.best, false) +
      (SINGLE ? '' : row('مرات وصيف', A.seconds, B.seconds, true)) +
      (A.bestRank !== null ? row('أفضل ترتيب عالمي', A.bestRank, B.bestRank, false, fmt(A.bestRank), fmt(B.bestRank))
        : SINGLE ? '' : row('مرات بالمركز الأخير', A.lasts, B.lasts, false)) +
    '</div></div></section>';
}

function render() {
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/');
  var html, active = 'home';
  if (parts[0] === 'season' && parts[1]) { html = seasonView(decodeURIComponent(parts[1])); }
  else if (parts[0] === 'mgr' && parts[1]) { html = managerView(decodeURIComponent(parts[1])); }
  else if (parts[0] === 'gw') { html = gwView(parts[1] ? +parts[1] : LAST_GW); active = 'gw'; }
  else if (parts[0] === 'archive') { html = homeView(); active = 'archive'; }
  else if (parts[0] === 'seasons') { html = seasonsView(); active = 'seasons'; }
  else if (parts[0] === 'managers') { html = managersView(); active = 'managers'; }
  else if (parts[0] === 'compare') { html = compareView(); active = 'compare'; }
  else { html = landingView(); }
  app.innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.className = 'tab' + (t.getAttribute('data-go') === active ? ' on' : '');
  });
  var sa = document.getElementById('selA'), sb = document.getElementById('selB');
  if (sa) sa.onchange = function () { cmpA = sa.value; app.innerHTML = compareView(); bindSelects(); };
  if (sb) sb.onchange = function () { cmpB = sb.value; app.innerHTML = compareView(); bindSelects(); };
}
function bindSelects() {
  var sa = document.getElementById('selA'), sb = document.getElementById('selB');
  if (sa) sa.onchange = function () { cmpA = sa.value; app.innerHTML = compareView(); bindSelects(); };
  if (sb) sb.onchange = function () { cmpB = sb.value; app.innerHTML = compareView(); bindSelects(); };
}

document.addEventListener('click', function (e) {
  var ctl = e.target.closest('[data-sort]');
  if (ctl) {
    gwSort = ctl.getAttribute('data-sort');
    var y = window.scrollY;
    app.innerHTML = gwView(gwCur || LAST_GW);
    window.scrollTo(0, y);
    return;
  }
  var el = e.target.closest('[data-gw],[data-season],[data-mgr],[data-go]');
  if (!el) return;
  if (el.hasAttribute('data-gw')) location.hash = '#/gw/' + el.getAttribute('data-gw');
  else if (el.hasAttribute('data-season')) location.hash = '#/season/' + encodeURIComponent(el.getAttribute('data-season'));
  else if (el.hasAttribute('data-mgr')) location.hash = '#/mgr/' + encodeURIComponent(el.getAttribute('data-mgr'));
  else {
    var g = el.getAttribute('data-go');
    location.hash = g === 'home' ? '#/' : '#/' + g;
  }
  window.scrollTo(0, 0);
});
window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

var toNum = function (v) {
  if (v === '' || v === null || v === undefined) return null;
  if (typeof v === 'number') return v;
  var n = Number(v);
  return isNaN(n) ? v : n;
};
var toBool = function (v) { return v === true || v === 1 || v === 'True' || v === 'true' || v === '1'; };

function paintUpdated() {
  var el = document.getElementById('lastUpdated');
  if (!el) return;
  if (!GENERATED_AT) { el.textContent = ''; return; }
  var d = new Date(GENERATED_AT);
  if (isNaN(d)) { el.textContent = ''; return; }
  el.innerHTML = 'آخر تحديث: <span class="num" style="direction:ltr;display:inline-block">' + esc(d.toLocaleString()) + '</span>';
}

function capCount(g, player) {
  var n = 0;
  GW_STATS.forEach(function (r) { if (r[0] === g && r[10] === player) n++; });
  return n;
}
function capTail(g, player) {
  var n = capCount(g, player);
  if (n < 2) return '';
  return ' — <span class="num" style="font-weight:800">' + n + '</span> مديرين حطّوا عليه الشارة';
}
function seasonWord(n) { return (n === 1 || n >= 11) ? 'موسم' : 'مواسم'; }
function titleWord(n) { return n === 1 ? 'لقب' : n >= 11 ? 'لقب' : 'ألقاب'; }
function timesWord(n) { return (n === 1 || n >= 11) ? 'مرة' : 'مرات'; }
function mgrWord(n) { return n >= 11 ? 'مدير' : 'مديرين'; }
function capWho(g, player, manager) {
  if (!player) return nameAr(manager);
  return player;
}
function capSub(g, player, manager) {
  if (!player) return 'ضبطت معاه الكبتنة';
  var n = capCount(g, player);
  if (n > 1) return '<span class="num" style="font-weight:800">' + n + '</span> ' + mgrWord(n) + ' عطوه الكبتنة وضبطت';
  return 'اختاره <bdi><b style="font-weight:800">' + nameAr(manager) + '</b></bdi> وضبطت';
}

function liveNote(g) {
  if (LIVE_GW === null || LIVE_GW !== g) return '';
  return '<div style="margin-top:10px;font-size:15px;font-weight:700;color:#04F5FF">جولة GW' + g + ' ليلحين شغّالة — الأرقام يمكن تتغيّر.</div>';
}

function ingest(d) {
  GW_STATS = (d.manager_gameweek_stats || []).map(function (r) {
    return [toNum(r.gameweek), r.manager_name, r.team_name, toNum(r.gw_points), toNum(r.cumulative_points),
      toNum(r.bench_points) || 0, toNum(r.overall_rank), toNum(r.num_transfers) || 0, toNum(r.transfer_cost) || 0,
      r.chip_played || null, r.captain_name || null, toNum(r.captain_multiplier), toNum(r.league_rank),
      r.rank_change === null || r.rank_change === undefined || r.rank_change === '' ? null : toNum(r.rank_change),
      toNum(r.entry_id), r.team_link || null, r.transferred_in || '', r.transferred_out || '',
      toNum(r.transfer_points_in), toNum(r.transfer_points_out), toNum(r.net_transfer_impact)];
  });
  GW_HL = (d.gameweek_highlights || []).map(function (h) {
    var o = {};
    Object.keys(h).forEach(function (k) { o[k] = h[k] === '' ? null : h[k]; });
    o.gameweek = toNum(o.gameweek);
    return o;
  });
  GW_POP = {};
  (d.player_gameweek_popularity || []).forEach(function (p) {
    var g = toNum(p.gameweek);
    if (!GW_POP[g]) GW_POP[g] = [];
    GW_POP[g].push([p.player_name, toNum(p.pct_owned) || 0, toNum(p.pct_captained) || 0]);
  });
  Object.keys(GW_POP).forEach(function (g) { GW_POP[g].sort(function (a, b) { return b[1] - a[1]; }); });
  SEASON_SUMMARY = d.season_summary || [];
  SEASON_HISTORY = d.season_history || null;
  GENERATED_AT = d.generated_at || null;
  LIVE_GW = d.live_gw === undefined || d.live_gw === null || d.live_gw === '' ? null : toNum(d.live_gw);
  computeGws();
  paintUpdated();
}

var SLUG = (function () {
  var m = /[?&]league=([\w-]+)/.exec(location.search);
  if (m) return m[1];
  var t = document.querySelector('meta[name="league-slug"]');
  return (t && t.getAttribute('content')) || 'q8';
})();
var RES = window.__resources || {};
var LEAGUE_URL = RES.leagueData || 'data/league.json';
var DATA_URL = RES.fplData || 'data/fpl-data.json';
var DATA_TRIES = RES.fplData ? [RES.fplData] : ['data/fpl-data.json', 'data/' + SLUG + '/fpl-data.json'];
var LEAGUE_TRIES = RES.leagueData ? [RES.leagueData] : ['data/league.json', 'data/' + SLUG + '/league.json'];

function loadJson(url) {
  return fetch(url, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    return r.json();
  });
}

function loadFirst(urls, kind) {
  var i = 0;
  return (function next() {
    if (i >= urls.length) throw new Error('no ' + kind + ' found in ' + urls.join(' , '));
    var u = urls[i++];
    return loadJson(u).then(function (j) {
      if (kind === 'data') DATA_URL = u; else LEAGUE_URL = u;
      return j;
    }, function () { return next(); });
  })();
}

function dataError(msg) {
  app.insertAdjacentHTML('afterbegin', '<section class="pad"><div class="wrap"><div style="background:#E90052;padding:18px;font-size:17px;font-weight:800;line-height:1.5">' + msg + '</div></div></section>');
}

Promise.all([
  loadFirst(LEAGUE_TRIES, 'league').then(function (l) {
    META = l.meta || {};
    AR = l.names || {};
    ROWS = (l.history || []).map(function (h) { return [h.season, h.rank, h.manager_name, h.team_name, h.total_points, h.overall_rank]; });
  }).catch(function (err) {
    console.error(err);
    return null;
  }),
  loadFirst(DATA_TRIES, 'data').then(ingest).catch(function (err) {
    console.error(err);
    computeGws();
    return 'ما قدرنا نقرأ ملف البيانات <span style="direction:ltr;display:inline-block">data/fpl-data.json</span> — بيانات الجولات ما راح تظهر.';
  })
]).then(function (errs) {
  buildHistory();
  paintBrand();
  render();
  errs.filter(function (e) { return typeof e === 'string'; }).forEach(dataError);
  if (!seasons.length) dataError('ما قدرنا نقرأ بيانات الأرشيف — لا <span style="direction:ltr;display:inline-block">data/league.json</span> ولا <span style="direction:ltr;display:inline-block">season_history</span> داخل ملف البيانات.');
});
</script>
</body>
</html>
